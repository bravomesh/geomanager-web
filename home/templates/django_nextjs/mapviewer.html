{% extends "django_nextjs/document_base.html" %}
{% load wagtailadmin_tags wagtailimages_tags static %}

{% block head %}
    {{ block.super }}
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fira+Sans:300,300i,400,400i,500,500i">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/geomanagerweb.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    :root {
        --primary-color: {{ theme.primary_color }};
        --secondary-color: {{ theme.secondary_color }};
        --accent-color: {{ theme.accent_color }};
        --primary-text-color: {{ theme.primary_text_color }};
        --secondary-text-color: {{ theme.secondary_text_color }};
        --background-color: {{ theme.background_color }};
        --primary-hover: color-mix(in srgb, var(--primary-color) 90%, black);
        --secondary-hover: color-mix(in srgb, var(--secondary-color) 90%, black);
        --accent-hover: color-mix(in srgb, var(--accent-color) 90%, black);
        --navbar-bg: var(--primary-color);
        --navbar-text: var(--primary-text-color);
        --footer-bg: var(--primary-color);
        --footer-text: var(--primary-text-color);
        --button-primary-bg: var(--secondary-color);
        --button-primary-text: var(--primary-text-color);
        --button-accent-bg: var(--accent-color);
        --button-accent-text: var(--secondary-text-color);
        --card-bg: var(--background-color);
        --text-body: var(--secondary-text-color);
    }
    </style>
{% endblock %}

{% block body %}
    <div id="django-svg-data-sprite">
        {{ svg_sprite|safe }}
    </div>
    {{ block.super }}
    {% include "partials/navbar.html" %}
{% endblock %}
