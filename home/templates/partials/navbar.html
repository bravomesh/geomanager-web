{% load static wagtailimages_tags %}

{% if navbar %}
<nav id="navbar" class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
  <div class="container">
    <!-- Logo positioned on the left -->
    <div class="logo-container">
      {% if navbar.logo %}
        <a href="/" class="navbar-logo">
          {% image navbar.logo fill-150x56 class="logo-img" %}
        </a>
      {% endif %}
    </div>

     <!-- Hamburger icon (visible only on small screens) -->
    <div class="navbar-burger" id="navbar-burger">
      <img id="burger-icon" src="{% static 'images/menu.svg' %}" alt="Open menu" style="width:32px;height:32px;">
      <img id="close-icon" src="{% static 'images/close.svg' %}" alt="Close menu" style="width:32px;height:32px;display:none;">
    </div>
    <!-- Menu links centered -->
    <ul class="navbar-menu" id="navbar-menu">
      {% for block in navbar.menu_links %}
        <li>
          <a class="navbar-item nav-main-item {% if block.value.name|upper == 'MAPVIEWER' %} mapviewer-link {% endif %}" href="{{ block.value.url }}">
            {{ block.value.name }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
</nav>
{% endif %}

<style>
.navbar{
    background-color: #034930;
}
.logo-container {
  position: relative;
  display: flex;
  align-items: center;
  margin: 0.5rem 1.5rem 0.5rem 0.5rem;
  min-width: 150px;
}

.logo-img {
  max-height: 60px;
  width: auto;
  display: block;
  transition: all 0.3s ease;
}

/* Navbar menu styling (minimal, adjust as needed) */
.navbar-menu {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  list-style: none;
  margin: 0;
  padding: 0;
}

.navbar-menu li {
  margin: 0 0.5rem;
  text-align: center;
}

.navbar-item.nav-main-item {
  color: white !important;
  font-weight: 600;
  font-size: 1.1rem;
  padding: 0.75rem 1.5rem;
  background-color: transparent !important;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: background-color 0.3s;
  border-radius: 4px;
  text-decoration: none;
  display: inline-block;
}

.navbar-item.nav-main-item:hover,
.navbar-item.nav-main-item.is-active {
  background-color: rgba(255, 255, 255, 0.15) !important;
  color: white !important;
}

.navbar-item.nav-main-item.mapviewer-link {
  background-color: #fbc02d !important; 
  border-radius: 64px;
  color: black !important;
}

.navbar-item.nav-main-item.mapviewer-link:hover {
  background-color: #dab511 !important; 
  color: black !important;
}

.navbar-burger{
    display: none;
    cursor: pointer;
    flex-direction: column;
    justify-content: center;
    padding: 0.5rem;
}

.navbar-burger span {
    display: block;
    width: 25px;
    height: 3px;
    background-color: white;
    transition: all 0.3s ease;
}
/* Responsive adjustments */
@media screen and (max-width: 1023px) {
  .navbar-menu {
    display: none;
  }
  .navbar-menu li {
    margin: 0.5rem 1rem;
  }
  .navbar-burger {
    display:block;
    position: absolute;
    right: 30px;
    top:6px;
  }
  .navbar-menu.active{
    display: flex;
    margin-top: 10px;
    flex-direction: column;
    align-items: center;
    width: 100%;
    background-color: #034930;
    transition: all 0.3s ease-in-out;
  }
  .logo-container {
    margin: 2rem 0 1.5rem 3rem;
  }
  .navbar-burger span {
  margin: 10px 0;
}
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const burger = document.getElementById("navbar-burger");
  const menu = document.getElementById("navbar-menu");
  const burgerIcon = document.getElementById("burger-icon");
  const closeIcon = document.getElementById("close-icon");

  burger.addEventListener("click", function () {
    const isActive = menu.classList.toggle("active");
    if(isActive){
      burgerIcon.style.display = "none";
      closeIcon.style.display = "block";
    } else {
      burgerIcon.style.display = "block";
      closeIcon.style.display = "none";
    }
  });
});
</script>
